# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
#  profile: D:/ruoyi/uploadPath
  profile: /home/ruoyi/uploadQuanyi
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  crypto:
    aesKeyBase64:

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8081
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password: hc
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: Z5TBr1vx2EwtALsEx8R9kHO9O7uKOCsv

  # 令牌有效期（默认30分钟）
  expireTime: 300

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc（Swagger / OpenAPI）配置
# 安全要求：生产环境不对外暴露任何接口文档，以下两项必须保持 false
springdoc:
  # 关闭 api-docs 接口文档（默认开启，必须显式关闭），关闭后 /v3/api-docs、/v3/api-docs/** 均不可访问
  api-docs:
    enabled: false
    path: /v3/api-docs
  # 关闭 Swagger UI 页面，关闭后 /swagger-ui.html、/swagger-ui/index.html 均不可访问
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
  # 分组配置仅在需要开放文档时使用，默认关闭 api-docs 后无需启用
  # group-configs:
  #   - group: 'default'
  #     display-name: '测试模块'
  #     paths-to-match: '/**'
  #     packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  # /h5-api/auth/*：登录/注册接口只接收手机号、密码、验证码，密码属凭证不应被转义（含 < > 等字符的密码会被改写导致登录失败）
  # /h5-api/user/resetpwd：改密接口同样只接收密码，理由同上
  excludes: /system/notice,/h5-api/auth/*,/h5-api/user/resetpwd
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/h5-api/*

# H5 端配置
h5:
  # token 有效期（分钟），默认 7 天；JWT exp 与 Redis 缓存 TTL 共用此值，如需缩短直接改这里
  token-expire-minutes: 10080
  # 密码登录：同一 IP 每分钟最大尝试次数（防止同一出口轮询多个手机号，阈值比单账号宽松以兼容 NAT）
  login-ip-max-per-minute: 20
